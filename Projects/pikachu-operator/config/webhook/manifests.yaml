---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-core-pikachu-com-v1alpha1-pikachu
  failurePolicy: Fail
  name: vpikachu.kb.io
  rules:
  - apiGroups:
    - core.pikachu.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pikachus
  sideEffects: None
